<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08110d">
  <title>GTA Blackjack Quick Calc</title>
  <link rel="stylesheet" href="styles.css?v=20261003-6">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GTA ONLINE • SOLO BLACKJACK</p>
        <h1>Quick Calc</h1>
      </div>
      <button id="newHandButton" class="new-hand-button" type="button">NEW HAND</button>
    </header>

    <section class="hands" aria-label="Current blackjack hand">
      <button id="dealerPanel" class="hand-panel dealer-panel active" type="button">
        <span class="hand-label">DEALER</span>
        <strong id="dealerCard" class="dealer-card">?</strong>
        <span id="dealerHint" class="hand-hint">Tap a rank below</span>
      </button>

      <button id="playerPanel" class="hand-panel player-panel" type="button">
        <span class="hand-label">YOU</span>
        <span id="playerCards" class="player-cards">—</span>
        <span id="handSummary" class="hand-hint">Waiting for dealer</span>
      </button>
    </section>

    <section id="resultPanel" class="result-panel" aria-live="polite">
      <div class="result-heading">
        <span id="resultLabel">ENTER DEALER CARD</span>
        <span id="remainingCount"></span>
      </div>
      <strong id="bestMove" class="best-move">—</strong>
      <div id="bestProbabilities" class="best-probabilities">Dealer first, then your cards.</div>
      <div id="actionEvs" class="action-evs" aria-label="Expected values"></div>
      <div id="resultNote" class="result-note"></div>
    </section>

    <section class="entry-panel" aria-label="Card entry">
      <div class="entry-heading">
        <span id="entryTarget">DEALER CARD</span>
        <span class="entry-help">Tap cards as they appear</span>
      </div>
      <div id="rankGrid" class="rank-grid"></div>
    </section>

    <section class="bottom-controls">
      <button id="undoButton" class="control-button" type="button">UNDO</button>
      <button id="switchTargetButton" class="control-button target-button" type="button">EDIT DEALER</button>
    </section>
  </main>

  <script type="module" src="app.js?v=20261003-6"></script>
</body>
</html>
