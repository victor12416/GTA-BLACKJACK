<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0f">
  <title>GTA Blackjack</title>
  <link rel="stylesheet" href="styles.css?v=20261003-8">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">GTA ONLINE • SOLO</p>
        <h1>Blackjack</h1>
      </div>
      <button id="newHandButton" class="new-hand" type="button">NEW HAND</button>
    </header>

    <section class="panel dealer-panel" aria-labelledby="dealer-title">
      <div class="panel-heading">
        <span id="dealer-title" class="step-label"><b>1</b> DEALER CARD</span>
        <strong id="dealerValue" class="dealer-value">—</strong>
      </div>
      <div id="dealerGrid" class="rank-grid dealer-grid" aria-label="Dealer showing card"></div>
    </section>

    <section class="panel player-panel" aria-labelledby="player-title">
      <div class="panel-heading">
        <span id="player-title" class="step-label"><b>2</b> YOUR HAND</span>
        <span id="handSummary" class="hand-summary">Add 2 cards</span>
      </div>

      <div id="playerCards" class="player-cards" aria-live="polite"></div>

      <div id="playerGrid" class="rank-grid player-grid" aria-label="Add a card to your hand"></div>
    </section>

    <section id="resultPanel" class="result-panel" aria-live="polite">
      <span class="step-label result-step"><b>3</b> BEST MOVE</span>
      <strong id="bestMove" class="best-move">—</strong>
      <div id="bestProbabilities" class="best-probabilities">Choose the dealer card, then add your cards.</div>
      <div id="resultLabel" class="result-status">WAITING</div>
    </section>

    <section class="controls">
      <button id="undoButton" class="control-button" type="button">UNDO</button>
      <button id="clearPlayerButton" class="control-button secondary" type="button">CLEAR HAND</button>
    </section>
  </main>

  <script type="module" src="app.js?v=20261003-8"></script>
</body>
</html>
